spring.application.name=fullbdwebsite
spring.datasource.url=jdbc:mysql://localhost:3306/txd_data?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=231217nstaro
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.port=8080
# --- 2. Cấu hình Connection Pool (HikariCP) ---
# Tên của Pool (để dễ theo dõi trong Log)
spring.datasource.hikari.pool-name=FullBD-HikariPool
# Số lượng kết nối tối đa cùng một lúc (Mặc định là 10)
spring.datasource.hikari.maximum-pool-size=10
# Số lượng kết nối tối thiểu luôn được giữ trong trạng thái chờ (Idle)
spring.datasource.hikari.minimum-idle=5
# Thời gian chờ tối đa để lấy 1 kết nối (30 giây)
spring.datasource.hikari.connection-timeout=30000
# Thời gian tối đa 1 kết nối được sống (30 phút)
spring.datasource.hikari.max-lifetime=1800000
logging.level.com.zaxxer.hikari=DEBUG
# Cấu hình thư mục lưu ảnh
app.upload.dir=./uploads